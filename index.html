<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Task & Deadline Monitor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e40af">
</head>
<body>

  <header>
    <h1>📚 Academic Task Monitor</h1>
    <p>Beleng National High School - SHS Task Tracker</p>
    <div class="header-actions">
      <button id="notifyBtn" class="btn-secondary">🔔 Enable Deadline Alerts</button>
      <button id="installBtn" class="btn-install" style="display: none;">📲 Install App</button>
    </div>
  </header>

  <main class="container">
    <section class="card form-section">
      <h2>Add New Academic Task</h2>
      <form id="taskForm">
        <div class="form-group">
          <label for="taskTitle">Task Name / Requirement</label>
          <input type="text" id="taskTitle" placeholder="e.g., Research Chapter 1-3, Cooking Activity" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="taskSubject">Subject / Strand</label>
            <select id="taskSubject" required>
              <option value="Practical Research">Practical Research</option>
              <option value="ICT / Programming">ICT / Programming</option>
              <option value="HUMSS Specialized">HUMSS Specialized</option>
              <option value="HE / Cookery">HE / Cookery</option>
              <option value="Oral Communication">Oral Communication</option>
              <option value="General Mathematics">General Mathematics</option>
              <option value="Other Subject">Other Subject</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskDeadline">Deadline Date & Time</label>
            <input type="datetime-local" id="taskDeadline" required>
          </div>
        </div>

        <div class="form-group">
          <label for="taskDesc">Task Description / Notes</label>
          <textarea id="taskDesc" rows="2" placeholder="Instructions, materials needed, or groupmates..."></textarea>
        </div>

        <button type="submit" class="btn-primary">+ Save Academic Task</button>
      </form>
    </section>

    <section class="filters">
      <button class="filter-btn active" data-filter="all">All Tasks</button>
      <button class="filter-btn" data-filter="upcoming">⏳ Upcoming</button>
      <button class="filter-btn" data-filter="overdue">🚨 Overdue</button>
      <button class="filter-btn" data-filter="completed">✅ Completed</button>
    </section>

    <section id="taskList" class="task-list"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
