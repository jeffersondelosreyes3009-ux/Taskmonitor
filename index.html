<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Task & Deadline Monitor</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: sans-serif; padding: 16px; background: #f4f6f9; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; font-weight: bold; }
    .overdue { border-left: 5px solid #dc2626; }
    .upcoming { border-left: 5px solid #f59e0b; }
    .completed { border-left: 5px solid #16a34a; opacity: 0.7; }
    .badge { font-size: 12px; padding: 3px 8px; border-radius: 4px; color: white; }
  </style>
</head>
<body>

  <h2>📚 Task & Deadline Monitor</h2>
  <button onclick="enableNotifications()" style="background:#059669;">🔔 Enable Lock Screen Alerts</button>

  <div class="card">
    <input type="text" id="taskTitle" placeholder="Task Name (e.g., Research Paper)">
    <input type="text" id="subject" placeholder="Subject (e.g., Practical Research 2)">
    <input type="datetime-local" id="deadline">
    <button onclick="addTask()">+ Add Academic Task</button>
  </div>

  <div id="taskList"></div>

  <script>
    // I-register ang Service Worker para sa notifications
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let tasks = JSON.parse(localStorage.getItem('shs_tasks')) || [];

    function enableNotifications() {
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          sendNotification("Notifications Active!", "Makakatanggap ka na ng alerts sa iyong lock screen.");
        }
      });
    }

    function sendNotification(title, body) {
      if (Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(title, {
            body: body,
            icon: 'https://flaticon.com',
            vibrate: [200, 100, 200]
          });
        });
      }
    }

    function addTask() {
      const title = document.getElementById('taskTitle').value;
      const subject = document.getElementById('subject').value;
      const deadline = document.getElementById('deadline').value;

      if (!title || !subject || !deadline) return alert("Punan lahat ng detalye!");

      tasks.push({
        id: Date.now(),
        title,
        subject,
        deadline,
        status: 'Pending',
        notified: false
      });

      saveAndRender();
      document.getElementById('taskTitle').value = '';
    }

    function toggleStatus(id) {
      tasks = tasks.map(t => t.id === id ? {...t, status: t.status === 'Pending' ? 'Completed' : 'Pending'} : t);
      saveAndRender();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('shs_tasks', JSON.stringify(tasks));
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      const now = new Date();

      tasks.forEach(task => {
        const due = new Date(task.deadline);
        const isOverdue = due < now && task.status === 'Pending';
        let statusClass = task.status === 'Completed' ? 'completed' : (isOverdue ? 'overdue' : 'upcoming');
        let label = task.status === 'Completed' ? 'Completed' : (isOverdue ? 'OVERDUE' : 'Upcoming');

        list.innerHTML += `
          <div class="card ${statusClass}">
            <strong>${task.title}</strong> <span class="badge" style="background:#333;">${task.subject}</span><br>
            <small>Deadline: ${due.toLocaleString()}</small><br>
            <small>Status: <b>${label}</b></small><br><br>
            <button onclick="toggleStatus(${task.id})" style="width:48%; background:#4b5563;">
              ${task.status === 'Pending' ? '✔ Mark Completed' : '↩ Undo'}
            </button>
            <button onclick="deleteTask(${task.id})" style="width:48%; background:#dc2626;">🗑 Delete</button>
          </div>
        `;
      });
    }

    // Mag-check bawat 30 segundo kung may malapit nang deadline o overdue
    setInterval(() => {
      const now = new Date();
      tasks.forEach(task => {
        const due = new Date(task.deadline);
        const diffMins = (due - now) / 60000;

        // Mag-notify kung 30 mins na lang bago ang deadline o overdue na
        if (task.status === 'Pending' && !task.notified && diffMins <= 30) {
          sendNotification(`⏰ Deadline Alert: ${task.subject}`, `${task.title} ay malapit nang mag-due o overdue na!`);
          task.notified = true;
          localStorage.setItem('shs_tasks', JSON.stringify(tasks));
        }
      });
      saveAndRender();
    }, 30000);

    saveAndRender();
  </script>
</body>
</html>
